name: Development Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  # ----------------- Tauri macOS 构建 (x86_64) -----------------
  build-tauri-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - name: Read Version
      id: version
      run: |
        VERSION=$(grep "^project.version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tauri-app/package-lock.json
    - name: Setup Rust (stable)
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Rust Target
      run: rustup target add ${{ matrix.target }}
    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri-app -> target
        cache-on-failure: true
    - name: Install cargo-about
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-about@0.9.1
    - name: Install Frontend Dependencies
      run: npm ci --include=dev
      working-directory: tauri-app

    - name: Replace ONNX Runtime with x86_64 build (v1.22.0, last official Intel package)
      run: |
        curl -sL https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-osx-x86_64-1.22.0.tgz | tar -xz -C /tmp
        cp -L /tmp/onnxruntime-osx-x86_64-1.22.0/lib/libonnxruntime.dylib \
          tauri-app/src-tauri/libs/libonnxruntime.dylib

    - name: Build Tauri App (macOS)
      run: npm run tauri -- build --bundles dmg --target ${{ matrix.target }}
      working-directory: tauri-app
    - name: Prepare Artifact
      run: |
        mkdir -p ci-artifacts
        shopt -s nullglob
        dmg_files=( tauri-app/target/${{ matrix.target }}/release/bundle/dmg/*.dmg )
        if [ ${#dmg_files[@]} -eq 0 ]; then
          echo "::error::No macOS DMG found"
          exit 1
        fi
        cp "${dmg_files[0]}" "ci-artifacts/MicYou-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: MicYou-macOS-${{ matrix.arch }}-${{ steps.version.outputs.version }}
        path: ci-artifacts/MicYou-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
        if-no-files-found: error
